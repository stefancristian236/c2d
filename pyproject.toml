[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c2d"
version = "0.1.0"
description = "A Python library for snapshot spectral array cubing and decubing."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Stefan", email = "cristicristi532@gmail.com" }
]
dependencies = [
    "numpy>=1.22.0",
    "astropy>=5.0",
    "scipy>=1.8.0",      
    "matplotlib>=3.5.0", 
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
c2d = ["py.typed"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]

[tool.mypy]
# Enforce strict typing across the package
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true 

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]